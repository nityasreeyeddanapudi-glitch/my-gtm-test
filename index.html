<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTM Practice Sandbox</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; }
        button { background-color: #4CAF50; color: white; padding: 15px 32px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 20px; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <div class="card">
        <h1>GTM Practice Site</h1>
        <p>This is a demo page to test your tags, triggers, and variables.</p>
        
        <button id="test-button">Click Me to Test a Trigger!</button>
        
        <p style="margin-top: 50px; color: #666;">Scroll down to test scroll tracking...</p>
        <div style="height: 1500px;"></div>
        <p>You reached the bottom! Great job.</p>
    </div>

</body>
</html>
